name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Match vercel.json installCommand so CI and production resolve the same tree.
      - run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          EQUILIBRIUM_JWT_SECRET: ci-jwt-secret-minimum-32-characters-long
          NEXT_PUBLIC_EQ_ENV: qa
